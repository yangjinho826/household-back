name: Deploy to Lightsail

on:
  push:
    tags: ['v*']        # v 로 시작하는 git tag push 시만 트리거 (의식적 배포)
  workflow_dispatch:    # 비상용 수동 트리거는 유지
    inputs:
      skip_gates:
        description: '비상용 — 배포 게이트 우회. 실행 기록이 job summary 에 남는다'
        type: boolean
        default: false

env:
  IMAGE_NAME: household-back
  GHCR_REPOSITORY: ghcr.io/yangjinho826/household-back

permissions:
  contents: read
  packages: write

jobs:
  # 배포 대상 커밋이 main 에 실제로 들어간 것인지 먼저 확인한다.
  # 이게 없으면 아무 브랜치에서 v* 태그만 밀어도 운영에 나간다.
  #
  # 한계(면접 미끼): Actions 는 "그 태그 커밋에 들어있는" 워크플로우 파일로 돈다.
  # 즉 이 guard 가 없던 시절 커밋에 태그를 달면 guard 자체가 실행되지 않는다.
  # 신뢰 경계가 검사 대상과 같은 커밋 안에 있어 파일로는 원리적으로 못 막는다 —
  # 그건 레포 설정(tag ruleset) 영역. 여기서 막는 건 "오늘 실수로 브랜치에 태그" 경로다.
  guard:
    name: Verify tag is on main
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # merge-base 판정에 전체 히스토리 필요

      - name: 게이트 우회 기록
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_gates }}
        run: |
          echo "::warning::배포 게이트 우회 — 실행자 ${{ github.actor }}"
          echo "⚠ 게이트 우회 (skip_gates=true)" >> "$GITHUB_STEP_SUMMARY"
          echo "- 실행자: ${{ github.actor }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- ref: ${{ github.ref }}" >> "$GITHUB_STEP_SUMMARY"

      # 태그 push 에는 inputs 자체가 없어 조건이 항상 참 → 우회 불가능.
      # set -e 로 fetch 실패도 곧바로 중단시킨다 (fail-closed).
      - name: main 포함 여부 검증
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_gates) }}
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::main 에 포함되지 않은 커밋의 태그다 ($GITHUB_SHA) — 배포 중단"
            exit 1
          }
          echo "✅ $GITHUB_SHA ⊂ origin/main"

  # ci.yml 이 PR 에서 부르는 것과 동일한 정의를 호출한다 — 정의가 하나라
  # "PR 은 초록인데 배포는 다른 테스트" 드리프트가 생길 수 없다.
  test:
    needs: guard
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_gates) }}
    uses: ./.github/workflows/test.yml

  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    needs: [guard, test]
    # skip_gates 로 test 가 건너뛰어졌을 때도 배포는 진행돼야 한다.
    # 반대로 test 가 '실패'했으면 여기서 멈춘다 (skipped ≠ failed).
    if: ${{ !failure() && !cancelled() }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        run: |
          echo "IMAGE_TAG=$(date +'%Y%m%d%H%M%S')-${GITHUB_SHA::8}" >> $GITHUB_ENV

      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_NAME }}:latest .

      - name: Tag Docker image
        run: |
          docker tag ${{ env.IMAGE_NAME }}:latest ${{ env.GHCR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          docker tag ${{ env.IMAGE_NAME }}:latest ${{ env.GHCR_REPOSITORY }}:latest

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image to GHCR
        run: |
          docker push ${{ env.GHCR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.GHCR_REPOSITORY }}:latest

      # 배포 직전 DB 스냅샷을 R2 의 pre-deploy/ 에 업로드 (14일 retention).
      # 이 스텝이 실패하면 set -e 로 워크플로우 중단 → 백업 없이 배포되는 일 방지.
      - name: Pre-deploy DB snapshot to R2
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          envs: IMAGE_TAG
          script: |
            set -e
            cd ~/household/household-back
            set -a; . ./.env; set +a
            DUMP=/tmp/pre-deploy-${IMAGE_TAG}.sql.gz
            docker compose exec -T postgres pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
              --format=plain --no-owner --no-privileges \
              | gzip > "$DUMP"
            rclone copy "$DUMP" "r2:${R2_BUCKET}/pre-deploy/" --progress
            rclone delete "r2:${R2_BUCKET}/pre-deploy/" --min-age 14d
            rm -f "$DUMP"
            echo "▶ pre-deploy snapshot: r2:${R2_BUCKET}/pre-deploy/pre-deploy-${IMAGE_TAG}.sql.gz"

      - name: Deploy to Lightsail via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            set -e
            cd ~/household/household-back
            # 서버 작업 트리는 main 을 그대로 따라가는 read-only 미러.
            # 누가 파일을 직접 고쳐 pull 이 충돌나는 걸 막으려고 강제로 main 에 맞춘다.
            git fetch origin main && git reset --hard origin/main

            # cron 자가복구 — 크론탭 유실(서버 교체·crontab -r 실수)을 매 배포마다 재등록으로
            # 예방한다. 멱등이라 반복 실행 안전. 배포 없는 기간의 유실은 Healthchecks.io
            # (성공 ping 끊김 감지)가 잡는다 — 예방과 감지의 커버 구간이 달라 둘 다 있다.
            bash infra/backup/register-cron.sh

            docker compose pull app

            # compose 가 rename 도중 이탈해서 남은 stuck 컨테이너 정리.
            # 이름이 정확히 'household-back' 인 정상 컨테이너는 건드리지 않고,
            # 'xxx_household-back' 같은 prefix 붙은 것만 강제 제거.
            stuck=$(docker ps -a --filter "name=household-back" --format '{{.ID}}\t{{.Names}}' \
              | awk -F'\t' '$2 != "household-back" {print $1}')
            if [ -n "$stuck" ]; then
              echo "▶ stuck 컨테이너 정리: $stuck"
              echo "$stuck" | xargs -r docker rm -f
            fi

            docker compose up -d --remove-orphans
            docker image prune -af --filter "until=24h"

      - name: Verify deployment
        run: echo "✅ Backend deployed — image ${{ env.GHCR_REPOSITORY }}:${{ env.IMAGE_TAG }}"

  # 배포 실패 알림 — 어느 job 이 죽든 Discord 로 즉시. 성공 알림은 안 보낸다
  # (태그 push 는 본인이 직접 하는 행위라 성공은 노이즈, 침묵-실패만 문제).
  notify-failure:
    name: Notify deploy failure
    runs-on: ubuntu-latest
    needs: [guard, test, build-and-deploy]
    if: failure()

    steps:
      - name: Discord 알림
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # 태그명은 curl 본문에 들어가므로 env 경유 — 인라인 치환은 인젝션 여지
          REF_NAME: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # secret 미설정이면 skip — curl 실패로 notify job 자체가 빨간 X 노이즈가 되는 것 방지
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::warning::DISCORD_WEBHOOK_URL secret 미설정 — 배포 실패 알림 생략"
            exit 0
          fi
          jq -n --arg c "🚨 household | 배포 실패: ${REF_NAME} — ${RUN_URL}" '{content: $c}' \
            | curl -fsS -m 10 --retry 3 -H 'Content-Type: application/json' -d @- "$DISCORD_WEBHOOK_URL" \
            || echo "::warning::Discord 알림 발송 실패"
