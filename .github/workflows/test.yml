name: Test (reusable)

# 이 워크플로우는 혼자 트리거되지 않는다. ci.yml(PR/머지) 과 deploy.yml(태그) 이
# 둘 다 이걸 호출한다 — 테스트 정의를 한 곳에 둬야 "PR 은 초록인데 배포는 다른
# 테스트를 돌리는" 게이트 드리프트가 구조적으로 불가능해진다.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (real PostgreSQL)
    runs-on: ubuntu-latest

    services:
      # 로컬 docker-compose.test.yml 과 동일 이미지. 포트를 55432 로 매핑하는 이유:
      # 커밋된 .env.test 가 127.0.0.1:55432 를 가리키므로 CI 전용 설정이 필요 없다.
      # SQLite 로 대체 불가 — 멱등성 ON CONFLICT / advisory lock 경합 테스트가 무효화된다.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_household
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test_household"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # conftest.py 는 최상단에서 .env.test 를 os.environ 에 덮어쓴 뒤 app 을 import 한다.
      # 파일이 없으면 import 단계에서 죽어 스택트레이스만 남으므로 원인을 먼저 못박는다.
      - name: .env.test 존재 확인
        run: |
          test -f .env.test || {
            echo "::error::.env.test 가 없다 — conftest 가 app import 전에 실패한다"
            exit 1
          }

      # setup-uv 액션 대신 공식 설치 스크립트 — 서드파티 액션 메이저 버전에 묶이지 않는다.
      - name: uv 설치
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # runner 기본 파이썬과 무관하게 .python-version(3.14) 인터프리터를 uv 가 직접 조달한다.
      - name: Python + 의존성 설치
        run: |
          uv python install
          uv sync --frozen

      # 스키마는 conftest 의 Base.metadata.create_all 이 만든다.
      # 이 레포 alembic baseline 은 빈 마이그레이션이라 upgrade head 로는 테이블이 안 생긴다.
      - name: pytest
        run: uv run pytest -q
