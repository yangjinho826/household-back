name: Rollback (직전 이미지로 + incident DB snapshot)

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  IMAGE_NAME: household-back
  GHCR_REPOSITORY: ghcr.io/yangjinho826/household-back

jobs:
  rollback:
    name: Rollback to previous image (+ incident DB snapshot)
    runs-on: ubuntu-latest

    steps:
      - name: Find previous timestamp tag from GHCR
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GHCR 의 패키지 version 목록 → 모든 tag 추출 →
          # timestamp-sha 형식만 필터 → 내림차순 정렬 → 2번째 (현재 :latest 의 직전)
          PREV=$(gh api -X GET /users/yangjinho826/packages/container/household-back/versions --paginate \
            --jq '.[].metadata.container.tags[]' \
            | grep -E '^[0-9]{14}-[a-f0-9]{8}$' \
            | sort -ru \
            | sed -n '2p')

          if [ -z "$PREV" ]; then
            echo "::error::직전 timestamp 태그를 찾지 못함. 수동 SSH 롤백 필요."
            exit 1
          fi

          echo "PREV_TAG=$PREV" >> "$GITHUB_OUTPUT"
          echo "▶ 직전 태그: $PREV"

      - name: Rollback via SSH (incident snapshot + image only)
        id: ssh
        uses: appleboy/ssh-action@v1.0.3
        env:
          PREV_TAG: ${{ steps.tag.outputs.PREV_TAG }}
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          envs: PREV_TAG
          script: |
            set -e
            cd ~/household/household-back
            set -a; . ./.env; set +a
            STAMP=$(date +'%Y%m%d%H%M%S')

            # 1) incident snapshot — 사고 시점 DB 보존 (개발자가 수동 복원/머지 시 필요)
            INC=/tmp/pre-rollback-${STAMP}.sql.gz
            docker compose exec -T postgres pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
              --format=plain --no-owner --no-privileges | gzip > "$INC"
            rclone copy "$INC" "r2:${R2_BUCKET}/pre-rollback/" --progress
            rclone delete "r2:${R2_BUCKET}/pre-rollback/" --min-age 14d
            rm -f "$INC"
            echo "▶ incident snapshot: r2:${R2_BUCKET}/pre-rollback/pre-rollback-${STAMP}.sql.gz"

            # 2) 옛 이미지 pull + 호스트 :latest 재매핑 + 컨테이너 재기동
            docker pull ${{ env.GHCR_REPOSITORY }}:${PREV_TAG}
            docker tag  ${{ env.GHCR_REPOSITORY }}:${PREV_TAG} ${{ env.IMAGE_NAME }}:latest

            # compose 가 rename 도중 이탈해서 남은 stuck 컨테이너 정리.
            # 이름이 정확히 'household-back' 인 정상 컨테이너는 건드리지 않고,
            # 'xxx_household-back' 같은 prefix 붙은 것만 강제 제거.
            stuck=$(docker ps -a --filter "name=household-back" --format '{{.ID}}\t{{.Names}}' \
              | awk -F'\t' '$2 != "household-back" {print $1}')
            if [ -n "$stuck" ]; then
              echo "▶ stuck 컨테이너 정리: $stuck"
              echo "$stuck" | xargs -r docker rm -f
            fi

            docker compose up -d --no-deps app
            docker compose ps

      - name: Notice
        run: |
          echo "✅ Image rolled back to ${{ steps.tag.outputs.PREV_TAG }}"
          echo "⚠  DB 는 자동 복원하지 않았음 — DDL 변경 동반된 사고면 SSH 로 수동 복원 필요"
          echo "📦 incident snapshot 은 r2:.../pre-rollback/ 에 저장됨 (14일 보존)"
          echo "📦 pre-deploy 백업 (복원 source) 은 r2:.../pre-deploy/ 에 있음"

      # 롤백은 이미 사고 상황에서 도는 워크플로우 — 이것마저 조용히 실패하면 최악의 침묵.
      - name: Discord 알림 (롤백 실패)
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::warning::DISCORD_WEBHOOK_URL secret 미설정 — 롤백 실패 알림 생략"
            exit 0
          fi
          jq -n --arg c "🚨 household | 롤백 실패 — 즉시 수동 개입 필요: ${RUN_URL}" '{content: $c}' \
            | curl -fsS -m 10 --retry 3 -H 'Content-Type: application/json' -d @- "$DISCORD_WEBHOOK_URL" \
            || echo "::warning::Discord 알림 발송 실패"
