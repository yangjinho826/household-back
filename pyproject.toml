[project]
name = "household"
version = "0.1.0"
description = "부부 공유 가계부 백엔드"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "apscheduler>=3.11.0",
    "asyncpg>=0.31.0",
    "bcrypt<4.1",
    "fastapi>=0.135.2",
    "greenlet>=3.3.2",
    "httpx>=0.28.1",
    "passlib[bcrypt]>=1.7.4",
    "pydantic-settings>=2.13.1",
    "python-jose[cryptography]>=3.5.0",
    "sqlalchemy[asyncio]>=2.0.48",
    "tzdata>=2026.2",
    "uvicorn>=0.42.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"           # 모든 async def test_ 자동 인식 (마커 불필요)
testpaths = ["tests"]
pythonpath = ["."]              # repo 루트를 sys.path 에 — app 패키지 import
# 세션 전역 engine 커넥션 풀이 테스트마다 다른 루프에 바인딩돼 깨지는 것 방지 —
# fixture·test 를 하나의 session 루프로 통일(async 테스트 표준 패턴).
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
