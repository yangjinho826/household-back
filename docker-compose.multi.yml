# 다중 인스턴스 실증 전용 스택 — 운영에서는 쓰지 않는다.
#
# 목적: 앱 인스턴스 2개가 같은 PostgreSQL 을 공유할 때 멱등성·advisory lock 이
# 프로세스 경계를 넘어서도 성립하는지 실측한다. 기존 테스트(A11/B6)는 한 프로세스
# 안의 경합이라 "다중 인스턴스" 주장의 직접 증거가 아니었다.
#
# 운영 docker-compose.yml 을 재사용하지 못하는 이유:
#   container_name 고정 / 원격 이미지 참조 / household-net(external) / 포트 미노출
#
# 실행: docker compose -f docker-compose.multi.yml up -d --build
# 정리: docker compose -f docker-compose.multi.yml down -v

name: household-multi

services:
  postgres:
    image: postgres:17-alpine # 운영과 동일 이미지 — ON CONFLICT / advisory lock 의미론 보존
    environment:
      POSTGRES_USER: proof
      POSTGRES_PASSWORD: proof
      POSTGRES_DB: proof_household
      TZ: Asia/Seoul
    # ddl/init.sql 은 안 태운다 — baseline 스냅샷에서 드리프트해 `init.sql → alembic
    # upgrade head` 체인이 끊기는 것을 이 스택 구성 중 확인했다 (docs/multi-instance-proof.md).
    # 스키마는 아래 schema-init 이 런타임 모델로 만든다.
    ports:
      # 55432 는 docker-compose.test.yml(pytest 용)이 쓰므로 충돌 회피
      - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proof -d proof_household"]
      interval: 3s
      timeout: 3s
      retries: 10

  # 스키마 1회 생성 (create_all + alembic stamp head). 앱보다 먼저 완료돼야 한다.
  schema-init:
    build: .
    entrypoint: [] # entrypoint.sh 의 alembic upgrade 를 우회 — 여기선 stamp 가 목적
    command: ["/app/.venv/bin/python", "-m", "tests.multi_instance.init_proof_schema"]
    environment: &app_env
      DATABASE_URL: "postgresql+asyncpg://proof:proof@postgres:5432/proof_household"
      JWT_SECRET: "multi-instance-proof-secret-key-0000000000"
      APP_NAME: household-proof
      DEBUG: "false"
      COOKIE_SECURE: "false"
      ALLOWED_ORIGINS: '["*"]'
      DISCORD_WEBHOOK_URL: "" # 실증 중 실발송 차단
      TZ: Asia/Seoul
    depends_on:
      postgres:
        condition: service_healthy

  # ── 앱 인스턴스 2개 ──
  # 둘 다 같은 DATABASE_URL 을 본다. depends_on 조건이 동일해 schema-init 이 끝나는
  # 순간 동시에 기동 → entrypoint 의 `alembic upgrade head` 가 경합하는 구간까지 관측된다.
  app1:
    build: .
    environment: *app_env
    ports:
      # LB 를 두지 않는 이유: 라운드로빈은 두 요청이 같은 인스턴스로 갈 수 있어
      # "서로 다른 프로세스가 경합했다"를 보장하지 못한다. 클라이언트가 포트로 직접 지정한다.
      - "8001:8000"
    depends_on:
      schema-init:
        condition: service_completed_successfully

  app2:
    build: .
    environment: *app_env
    ports:
      - "8002:8000"
    depends_on:
      schema-init:
        condition: service_completed_successfully
